<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Өсөх Өгий · Үнэлэмж</title>
<meta name="description" content="Өсөх Өгий жуулчны баазын зочдын үнэлгээ, сэтгэгдэл">
<link rel="stylesheet" href="../assets/ue.css?v=5">
</head>
<body data-place="usukh-ugii">
<header class="hero">
  <div class="hero-bg" id="herobg"></div>
  <nav class="topbar"><a href="../">← Нүүр</a><a class="logo" href="../"><i>★</i>Үнэлэмж</a></nav>
  <div class="hero-in">
    <span class="label" id="cat"></span>
    <h1 id="name"></h1>
    <p class="sub" id="sub"></p>
    <div class="chips" id="chips"></div>
    <button class="btn" id="open">★ Үнэлгээ өгөх</button>
  </div>
</header>

<main class="page">
  <div id="gal"></div>
  <section class="card" id="aboutc" hidden><p class="about" id="about"></p></section>
  <section class="card"><h2>Үнэлгээ</h2><div id="sum"><p class="empty">Ачааллаж байна…</p></div></section>
  <section class="card" id="tagblk" hidden><h2>Зочид юуг онцолсон бэ</h2><div class="tags" id="tags"></div></section>
  <h2 class="sec-t">Сэтгэгдэл</h2>
  <div class="revs" id="revs"></div>
  <button class="btn ghost" id="more" hidden>Цааш үзэх</button>
  <p class="note">Сэтгэгдлийг зочид өөрсдөө бичдэг. Эзэмшигч хариулж болох ч засаж, устгаж чадахгүй.</p>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Үнэлгээ өгөх">
  <div class="in">
    <div class="fhead"><button class="x" id="fx" aria-label="Хаах">×</button><div class="prog"><i id="fprog"></i></div></div>
    <div class="q" id="fq"></div>
    <p class="err" id="ferr" role="alert"></p>
    <button class="btn" id="fnext">Үргэлжлүүлэх</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="../assets/config.js?v=5"></script>
<script src="../assets/api.js?v=5"></script>
<script src="../assets/place.js?v=5"></script>
</body>
</html>
