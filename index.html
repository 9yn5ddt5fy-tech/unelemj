<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Үнэлэмж</title>
<meta name="description" content="Газар, үйлчилгээний бодит үнэлгээ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ue.css">
</head>
<body>
<main class="wrap" style="padding-top:40px">
  <h1 style="font-size:32px;font-weight:800">Үнэлэмж</h1>
  <p class="mute" style="margin-top:6px">Газар, үйлчилгээний бодит үнэлгээ. Удахгүй олон газартай болно.</p>
  <div class="blk" id="places" style="display:grid;gap:10px"></div>
</main>
<script src="assets/config.js"></script>
<script>
  const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  document.getElementById("places").innerHTML=Object.entries(window.UE_PLACES||{}).map(([s,p])=>
    `<a class="card" href="${esc(s)}/" style="text-decoration:none;color:inherit"><b style="font-size:17px">${esc(p.name)}</b><span class="mute">${esc([p.category,p.location].filter(Boolean).join(" · "))}</span></a>`).join("");
</script>
</body>
</html>
